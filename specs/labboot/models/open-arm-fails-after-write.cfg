\* Open: the first arm (in exec boot_once) fails after writing the one-shot and, unlike a re-arm, does not cancel it. On U-Boot Macs only a failure after the variable file is renamed in place (its directory fsync, a readback) leaves it armed for the next boot: the model, with one copy of the one-shot, makes this broader than it is.
\* expect: ArmFailedMeansDisarmed
SPECIFICATION Spec
CONSTANTS
    BootTimeout = 6
    BootLen = 2
    TestLen = 2
    MaxTime = 70
    Skew = 1
    OOB = TRUE
    Faults = {"ArmFailsAfterWrite"}
    Bugs = {}
INVARIANTS
    TypeOK
    ArmFailedMeansDisarmed
