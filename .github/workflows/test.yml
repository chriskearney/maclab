name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -timeout 40m ./...
      - run: make all
      # labd and lab also run on the controller Mac
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./cmd/labd ./cmd/lab
  spec:
    # The TLA+ specs: today's design must pass, and each replayed bug must fail.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: make spec
