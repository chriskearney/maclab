name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -timeout 20m ./...
      - run: make all
      # labd and lab also run on the controller Mac
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./cmd/labd ./cmd/lab
