name: image
# Builds the labd image from the Dockerfile and smoke-tests it on an empty
# data volume, as served at /maclab behind a proxy. Nothing is pushed.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t maclab:ci .
      - run: bash .github/scripts/image-smoke.sh maclab:ci https://maclab.chonkbase.net
      - run: bash .github/scripts/image-smoke.sh maclab:ci https://chonkbase.net/maclab
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labd-smoke-log
          path: ${{ runner.temp }}/labd-smoke.log
          if-no-files-found: ignore
  python:
    # The Python callers' transport policy and the Kubernetes manifests.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # test_manifests renders with kubectl and parses with PyYAML; -I ignores
      # the user site, so PyYAML goes into this interpreter itself.
      - run: python3 -m pip install pyyaml
      - run: kubectl version --client
      - run: python3 -B -E -s -m unittest discover -s tests -v
        working-directory: tools/bt2
      - run: python3 -I -B -m unittest discover -s scripts/boot-test -p 'test_https_runtime.py' -v
      - run: python3 -I -B -m unittest discover -s scripts/workflow/m1 -p 'test_https_controller.py' -v
      # A skip (no kubectl) must fail the job, not pass it.
      - run: |
          out=$(python3 -I -B deploy/k8s/test_manifests.py -v 2>&1); rc=$?
          echo "$out"
          [ "$rc" = 0 ] && grep -qx OK <<<"$out"
